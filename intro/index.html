<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardy 入门动画 · 从零理解张量切分</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='7' height='7' x='1' y='1' rx='1.5' fill='%2338bdf8'/%3E%3Crect width='7' height='7' x='8' y='1' rx='1.5' fill='%23c084fc'/%3E%3Crect width='7' height='7' x='1' y='8' rx='1.5' fill='%23fbbf24'/%3E%3Crect width='7' height='7' x='8' y='8' rx='1.5' fill='%23fb7185'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div id="stage">
    <header id="hdr">
      <div id="scene-kicker">Shardy 入门</div>
      <h1 id="scene-title">标题</h1>
      <p id="scene-sub">副标题</p>
    </header>

    <main id="visual"></main>

    <aside id="side">
      <div id="side-cap">说明</div>
      <pre id="code"></pre>
    </aside>

    <footer id="ftr">
      <div id="dots"></div>
      <div id="caption"></div>
    </footer>
  </div>

  <div id="controls">
    <button id="btn-restart" title="回到开头">⏮</button>
    <button id="btn-prev" title="上一幕 (←)">◀</button>
    <button id="btn-play" title="播放/暂停 (空格)">⏸</button>
    <button id="btn-next" title="下一幕 (→)">▶</button>
    <span id="counter">1 / 1</span>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>
</div>

<script src="app.js"></script>
<script src="scenes.js"></script>
</body>
</html>
